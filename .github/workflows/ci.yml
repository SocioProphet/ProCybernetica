name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: pytest -q

  ci-observation-receipt:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build CI receipt
        run: |
          cat > receipt.md <<EOF
          \`\`\`json
          {
            "ci_observation_ledger_version": "v0.1",
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow_name": "${{ github.workflow }}",
            "workflow_run_id": "${{ github.run_id }}",
            "conclusion": "${{ needs.test.result }}",
            "trigger": "${{ github.event_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "actor": "${{ github.actor }}"
          }
          \`\`\`
          EOF

      - name: Post CI receipt to ledger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 32 --repo "$GITHUB_REPOSITORY" --body-file receipt.md
