name: control-node

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemas/control_node.schema.json"
      - "tools/cybernetic_governance/validate_control_node.py"
      - "tests/fixtures/control-node/**"
      - "tests/test_control_node.py"
      - ".github/workflows/control-node.yml"
  push:
    branches: [main]
    paths:
      - "schemas/control_node.schema.json"
      - "tools/cybernetic_governance/validate_control_node.py"
      - "tests/fixtures/control-node/**"
      - "tests/test_control_node.py"
      - ".github/workflows/control-node.yml"

permissions:
  contents: read

jobs:
  control-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      # Teeth both ways: a valid registry validates; unknown node_type / no obligations /
      # duplicate identity / duplicate control-function / unknown gate / bad resource kind are rejected.
      - name: Validate ControlNode registries (ADR-0002 GAP-3)
        run: make control-node-ci
