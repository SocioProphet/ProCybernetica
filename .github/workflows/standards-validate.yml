name: Standards Validate

on:
  pull_request:
    paths:
      - 'standards/**'
      - 'docs/standards/**'
      - 'schemas/**'
      - 'tests/governance/**'
      - '.github/workflows/standards-validate.yml'
  push:
    branches: [ main ]
    paths:
      - 'standards/**'
      - 'docs/standards/**'
      - 'schemas/**'
      - 'tests/governance/**'
      - '.github/workflows/standards-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip jsonschema pytest
      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('schemas').rglob('*.json'):
              json.loads(path.read_text())
              print(f'parsed {path}')
          PY
      - name: Run governance tests
        run: pytest -q tests/governance
