v1_3_cross_field_rules:
  status: draft-v0.1
  doctrine_ref: docs/doctrine/cairnmark-to-stele-transition.v1.md
  additive_fields_ref: schemas/_common/v1-3-additive-fields.json

  rules:
    - rule_name: authority_layer_bounded_by_inputs
      applies_to:
        - all_m_series_v1_3
        - all_procyb_safety_case_v1_1
      severity: S1
      description: >-
        Artifact authority_layer is bounded above by the lowest authority_layer
        in upstream evidence. Partial order: commonsense_prior < grounded_schema
        < institutional_truth.
      pseudo_logic: |
        for each upstream_evidence_ref in artifact:
            upstream_authority_layer = resolve_authority_layer(upstream_evidence_ref)
            assert artifact.authority_layer <= upstream_authority_layer
      falsification_refs:
        - F4.3
        - F7.2

    - rule_name: promotion_state_requires_reasoning_trace
      applies_to:
        - all_m_series_v1_3
        - all_procyb_safety_case_v1_1
      severity: S1
      description: >-
        Promoted and rejected artifacts require explicit adjudication evidence.
      pseudo_logic: |
        if artifact.promotion_state in (promoted_stele, rejected):
            assert artifact.reasoning_trace_ref is not null
            assert artifact.reasoning_trace_ref.adjudication_outcome in (admitted, partial, rejected)
            assert artifact.reasoning_trace_ref.adjudication_authority_layer in (institutional_truth, grounded_schema)
      falsification_refs:
        - F4.1
        - F4.2
        - F4.5

    - rule_name: composite_fragments_match_promotion_state
      applies_to:
        - m1_composite_v1_3
        - procyb_safety_case_v1_1
      severity: S1
      description: >-
        A composite artifact cannot be promoted while referencing candidate
        fragments. Every referenced fragment must be promoted_stele.
      pseudo_logic: |
        if artifact.promotion_state == promoted_stele:
            for each fragment_ref in artifact.fragments:
                assert fragment_ref.promotion_state == promoted_stele
      falsification_refs:
        - F4.6

    - rule_name: rejected_state_terminal_except_supersede
      applies_to:
        - all_m_series_v1_3
        - all_procyb_safety_case_v1_1
      severity: S1
      description: >-
        Rejected artifacts cannot be relitigated into candidate state under the
        same artifact identifier. Reissue requires a new artifact ID with
        divergence_parent or supersedes lineage.
      pseudo_logic: |
        if previous_version.promotion_state == rejected:
            assert artifact.artifact_id != previous_version.artifact_id or artifact.promotion_state == superseded
      falsification_refs:
        - F4.2

  non_claims:
    - These rule specifications are not executable validators by themselves.
    - Concrete Python enforcement should land in the validator issue after schemas stabilize.
    - These rules intentionally complement JSON Schema because JSON Schema alone cannot enforce cross-document state or authority resolution.
